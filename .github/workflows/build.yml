name: Build Internal DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ./CombatMaster_Assistant

    steps:
    - uses: actions/checkout@v4

    - name: Download imgui
      run: |
        Remove-Item -Recurse -Force include/imgui -ErrorAction Ignore
        git clone -b docking https://github.com/ocornut/imgui.git include/imgui

    - name: Configure CMake
      run: cmake -B build -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexus_Internal_DLL
        path: |
          CombatMaster_Assistant/build/Release/Nexus_Internal.dll
